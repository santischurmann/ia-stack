# Los gates de este protocolo corrian SOLO en la maquina del autor.
#
# Encontrado el 2026-09-14 comparando IA Stack contra otro protocolo que si tenia integracion
# continua: este repositorio no tenia `.github/` en absoluto. Todo lo que se publicaba —1718 pruebas,
# 53 scripts, 115 limites honestos— estaba verificado en un solo lugar, por una sola persona, y nadie
# que clonara podia comprobar nada sin correrlo a mano. Un protocolo cuya promesa es «cada afirmacion
# importante tiene detras un comando que la respalda» no puede pedirle eso a quien lo instala.
#
# ESTE ARCHIVO SE AGREGO, SE RETIRO Y VOLVIO, y la historia importa porque explica el criterio. Se
# retiro por decision del operador, tomada sobre un dato que el asistente le dio MAL: se le dijo que
# el flujo consumia minutos de su cuenta. Eso es cierto en repositorios privados y falso en este, que
# es publico — en repositorios publicos GitHub Actions no tiene costo ni tope. Con el dato corregido
# la decision se reviso y el flujo volvio. Queda escrito porque una decision tomada sobre un dato
# falso no es una decision, y el registro de que se corrigio vale mas que disimular que no paso.
#
# Y LA PRIMERA CORRIDA ENCONTRO LO QUE TENIA QUE ENCONTRAR. El 2026-09-16, con el flujo corriendo
# solo en Ubuntu, nueve pruebas salieron rojas: la suite asumia Windows —PowerShell, el shim de WSL,
# junctions, rutas con letra de unidad— y nunca habia corrido en otro lado. No era una regresion:
# era el estreno. De ahi sale la matriz de abajo, y de ahi sale `contracts/platform-scope.json`: una
# prueba que no corre en una plataforma se declara, y se saltea como **VACIO** y nunca como OK.
# «No habia nada que comparar» no es «compare y paso», y seria incoherente que el repositorio del
# protocolo se aplicara al reves su propio vocabulario.
#
# ADEMAS ESTO MIDE ALGO QUE LA MAQUINA DEL AUTOR NO PUEDE MEDIR: si un verde depende de estado local
# no rastreado. Ya paso, y fue este flujo el que lo encontro: la cobertura daba 100% en la maquina
# del autor y RECHAZABA en un clon limpio, porque dos ramas solo se ejecutaban si existia
# `graphify-out/`, que esta en .gitignore. Ese verde era de una carpeta, no del repositorio.
#
# LO QUE ESTE FLUJO NO HACE, dicho para que nadie lo suponga: no corre `verify-graphify-manifest`,
# porque necesita un grafo construido que no viaja en el repositorio y su prueba ya se saltea
# diciendolo. No publica nada, no despliega nada y no toca ningun secreto: el token solo puede leer.

name: CI

on:
  push:
  pull_request:

# Minimo privilegio: este flujo lee el codigo y nada mas. Sin esto, el token por defecto puede
# escribir en el repositorio, que es mas permiso del que hace falta para correr pruebas.
permissions:
  contents: read

jobs:
  gates:
    name: Suite y gates sobre un clon limpio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # `fail-fast: false` a proposito: si Ubuntu falla, queremos ver igual que hizo Windows. Cortar
      # el otro trabajo esconde justo la comparacion que esta matriz existe para hacer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v5
        with:
          # El historial completo: varios gates comparan contra la base de la rama, y con un clon
          # superficial esa comparacion no existe y se leeria como «no hay nada que revisar».
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Sin dependencias, a proposito
        # `shell: bash` explicito: en el runner de Windows el shell por omision es PowerShell, y
        # `test ! -f` no existe ahi. GitHub provee bash en los tres runners.
        shell: bash
        run: |
          test ! -f package.json || (echo "Este protocolo se declara sin dependencias externas y aparecio un package.json" && exit 1)
          node --version

      - name: Suite completa
        run: node --test

      - name: Cada prueba que no corre en esta plataforma esta declarada
        run: node scripts/verify-platform-scope.mjs check

      - name: El repositorio no publica la identidad de quien lo escribio
        run: node scripts/verify-repo-clean.mjs check

      - name: El indice cubre todo lo rastreado
        run: node scripts/verify-ia-stack-index.mjs check

      - name: Las promesas visibles del protocolo y sus limites honestos
        run: node scripts/verify-ia-stack-contract.mjs check

      - name: Cada gate se comporta sobre un directorio vacio como declara
        run: node scripts/verify-empty-probe.mjs check contracts/empty-probe.json

      - name: El runtime instalado es el del checkout
        run: node scripts/verify-runtime-sync.mjs check

      # EL TOPE DE TAP DEJA EL TRIPLE SOBRE EL ARCHIVO MAS LENTO. Es un paso propio y no una prueba
      # de la suite a proposito: adentro de la suite medía contencion y no duracion -- 96 s solo
      # contra 224 s desde adentro, factor 2,3x sobre el tope de entonces --. Aca corre solo.
      #
      # Y ESTE PASO ES EL QUE DECIDE DE VERDAD. El mismo gate corrido en una maquina de trabajo da
      # numeros que no significan nada -- el 2026-09-17 el mismo archivo dio 89, 101, 116 y 247 s en
      # una tarde, con la CPU al 100% por procesos ajenos al repositorio --, y ahi escribe
      # RECONCILIAR y sale 0 en vez de inventar un veredicto. El runner esta quieto: aca juzga.
      - name: El tope de TAP deja el triple sobre el archivo de pruebas mas lento
        run: node scripts/verify-test-duration.mjs

      # CADA PLATAFORMA MIDE LO SUYO Y LO SUBE. El veredicto no se toma aca: se toma sobre la UNION,
      # en el trabajo de abajo. Medir por separado y exigir 100% en cada uno seria pedirle a Linux
      # que ejecute ramas que solo existen en Windows.
      # EL DIRECTORIO NO EMPIEZA CON PUNTO, A PROPOSITO. `upload-artifact` ignora los archivos
      # ocultos por omision: con `.cobertura` el paso salia en VERDE habiendo subido nada, y la
      # fusion se topaba con cero archivos. `include-hidden-files: true` lo arreglaria igual y
      # dejaria la trampa armada para el proximo directorio con punto.
      - name: Medir la cobertura de esta plataforma
        shell: bash
        run: |
          rm -rf cobertura && mkdir -p cobertura
          # DOS REPORTERS A LA VEZ, y el TAP sale de ESTA corrida y no de la primera: este paso
          # borra el directorio, asi que un TAP escrito antes se perderia. `spec` a la consola
          # -- lo que alguien lee en el log -- y `tap` al archivo que la fusion necesita para
          # saber QUE salteo cada plataforma. No agrega una corrida: esta ya existia.
          NODE_V8_COVERAGE=cobertura node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=cobertura/salteos.tap

      - name: Subir la cobertura cruda
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ matrix.os }}
          path: cobertura
          retention-days: 1
          # Subir cero archivos no es un exito: seria medir sobre la nada mas abajo.
          if-no-files-found: error

  cobertura:
    name: Cobertura sobre la union de las plataformas
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # LOS DOS DIRECTORIOS EN UNO SOLO. El gate ya combina varios archivos de `NODE_V8_COVERAGE`
      # -- uno por proceso -- y eso es lo que hace todos los dias: esto es la misma operacion con
      # mas archivos. No hay parser nuevo, ni formato nuevo, ni un segundo veredicto.
      - name: Bajar la cobertura de las dos plataformas
        uses: actions/download-artifact@v8
        with:
          pattern: cobertura-*
          path: cobertura-bajada

      - name: Juntar todo en un solo directorio
        shell: bash
        run: |
          mkdir -p cobertura
          # Los nombres vienen repetidos entre plataformas -- `coverage-<pid>-<ts>.json` --, asi que
          # se prefija con el origen: dos archivos distintos que se pisan medirian la mitad, en
          # silencio, que es el modo de falla que esta fusion viene a impedir.
          for dir in cobertura-bajada/*/; do
            origen=$(basename "$dir")
            for f in "$dir"*.json; do
              [ -e "$f" ] || continue
              cp "$f" "cobertura/${origen}-$(basename "$f")"
            done
          done
          echo "plataformas que aportaron: $(ls -1d cobertura-bajada/*/ 2>/dev/null | wc -l)"
          echo "archivos de cobertura fusionados: $(ls -1 cobertura | wc -l)"
          # DOS GUARDAS, y la primera es la que faltaba: con una sola plataforma el 100% no es sobre
          # la union, y decir que si seria la mentira que esta fusion vino a sacar.
          test "$(ls -1d cobertura-bajada/*/ 2>/dev/null | wc -l)" -eq 2 || (echo "no llegaron las dos plataformas: la union no se puede armar" && exit 1)
          test "$(ls -1 cobertura | wc -l)" -gt 0 || (echo "no llego un solo archivo de cobertura: no hay nada que medir" && exit 1)

      # EL GATE DE SIEMPRE, sobre la union. El 100% pasa a significar «toda rama alcanzable en alguna
      # plataforma soportada se ejecuto en alguna», y una rama que NINGUNA alcanza es un hueco de
      # pruebas de verdad -- que es lo que este gate tiene que cazar y antes no podia, porque medir
      # solo en Windows dejaba las ramas de Linux sin comprobar por nadie.
      - name: Cobertura de cada script inventariado, sobre la union
        run: node scripts/verify-ia-stack-coverage.mjs --coverage-dir cobertura

      # LO QUE CADA PLATAFORMA SALTEO DE VERDAD. Un salteo en las DOS no rompe nada -- los
      # self-checks del repositorio se saltean en todos lados --; lo que importa es una prueba que se
      # saltea en una y CORRE en la otra, porque ahi una plataforma tiene un hueco que la otra no.
      # Medido el 2026-09-16 sobre una corrida verde: Linux salteo 12 que Windows corrio, y solo 2
      # estaban declaradas. El gate informaba que ninguna se salteaba sin declarar.
      - name: Ninguna plataforma saltea algo que la otra corre sin declararlo
        shell: bash
        run: |
          a=$(ls cobertura-bajada/*/salteos.tap | head -1)
          b=$(ls cobertura-bajada/*/salteos.tap | tail -1)
          test "$a" != "$b" || (echo "no llegaron los dos TAP: sin las dos corridas no se puede comparar" && exit 1)
          node scripts/verify-platform-scope.mjs simetria "$a" "$b"
